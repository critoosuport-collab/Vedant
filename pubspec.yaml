name: vedant
description: Vedant — Universal File Studio. No ads, no limits.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # File picking & permissions
  file_picker: ^8.0.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # PDF viewing (native on Android)
  flutter_pdfview: ^1.3.2

  # Excel / CSV
  excel: ^4.0.6

  # ZIP + XML (for PPTX parsing)
  archive: ^3.6.1
  xml: ^6.5.0

  # Image editing
  image: ^4.2.0

  # Fonts
  google_fonts: ^6.2.1

  # Open With — receive incoming file from Android intent
  receive_sharing_intent: ^1.8.0

  # Save/share files
  share_plus: ^9.0.0

  # Shared preferences (for recent files + theme)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
